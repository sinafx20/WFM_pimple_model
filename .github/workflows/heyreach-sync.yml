# Polls HeyReach and writes LinkedIn outreach onto HubSpot contact timelines.
#
# This runs here rather than on a laptop because HeyReach has no webhooks (three endpoint
# shapes probed 2026-09-01, all 404) so it must be polled, and the laptop sleeps: the 7am
# scheduled task missed 4 of the last 5 weekdays and a token rotation killed a run
# mid-flight. GitHub's runner has neither problem.
#
# The sync is idempotent. Every note carries a [volcano:<kind>:<leadId>] marker and the
# script reads existing notes before writing, so state lives in HubSpot and a fresh
# checkout each run costs nothing. Verified: an immediate re-run found 0 to write and
# recognised all 232 existing notes.
#
# SECRETS REQUIRED (repo Settings > Secrets and variables > Actions):
#   HEYREACH_API_KEY, HUBSPOT_TOKEN, INSTANTLY_API_KEY
name: Volcano sync (HeyReach to HubSpot, then engagement rollup)

on:
  schedule:
    # Every 2 hours. LinkedIn activity is slow enough that this is plenty, and it keeps
    # well clear of any rate ceiling.
    - cron: '0 */2 * * *'
  workflow_dispatch:        # so it can be run by hand from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync LinkedIn activity to HubSpot
        working-directory: heygen-studio
        env:
          HEYREACH_API_KEY: ${{ secrets.HEYREACH_API_KEY }}
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: node heyreach-to-hubspot.mjs --commit

      # Runs second because it reads what the step above just wrote. This is what keeps the
      # cockpit live and what gives the routing workflows something to fire on: without it,
      # volcano_heat never moves and a contact can engage without anyone being told.
      # It still runs if the LinkedIn sync failed, since the other signals are independent.
      - name: Roll engagement up onto contacts
        if: always()
        working-directory: heygen-studio
        env:
          HEYREACH_API_KEY: ${{ secrets.HEYREACH_API_KEY }}
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          # Without this the rollup silently skips open counts AND reply sentiment, which is how
          # an unsubscribe could go undetected on every scheduled run.
          INSTANTLY_API_KEY: ${{ secrets.INSTANTLY_API_KEY }}
        run: node volcano-rollup.mjs --commit
